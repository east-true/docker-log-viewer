name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose /repo

  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go and check known vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...
          repo-checkout: false
          cache-dependency-path: go.sum

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build binary
        run: go build -trimpath -o /tmp/docker-log-viewer ./cmd/docker-log-viewer

      - name: Build container image
        run: docker build --tag docker-log-viewer:ci .

  ui:
    name: UI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: go build -trimpath -o "$RUNNER_TEMP/docker-log-viewer" ./cmd/docker-log-viewer

      - name: Start application
        shell: bash
        run: |
          agent_token="$(openssl rand -hex 32)"
          echo "DOCKER_LOG_VIEWER_AGENT_TOKEN=$agent_token" >> "$GITHUB_ENV"
          DOCKER_LOG_VIEWER_AGENT_TOKEN="$agent_token" \
            "$RUNNER_TEMP/docker-log-viewer" server \
            -listen 127.0.0.1:18080 \
            -agent-listen 127.0.0.1:19080 \
            -agent-insecure >"$RUNNER_TEMP/docker-log-viewer.log" 2>&1 &
          echo "DLV_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
              exit 0
            fi
            echo "waiting for application ($attempt/30)"
            sleep 1
          done
          cat "$RUNNER_TEMP/docker-log-viewer.log"
          exit 1

      - name: Start local Docker Agent
        shell: bash
        run: |
          "$RUNNER_TEMP/docker-log-viewer" agent \
            -server 127.0.0.1:19080 \
            -state-dir "$RUNNER_TEMP/agent-state" \
            -name ci-docker-host \
            -insecure >"$RUNNER_TEMP/docker-log-viewer-agent.log" 2>&1 &
          echo "DLV_AGENT_PID=$!" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/agents | grep --quiet '"connected":true'; then
              exit 0
            fi
            echo "waiting for Agent ($attempt/30)"
            sleep 1
          done
          cat "$RUNNER_TEMP/docker-log-viewer-agent.log"
          exit 1

      - name: Start live-log fixture
        run: |
          docker run --rm --detach --name docker-log-viewer-ci-smoke alpine:3.22 \
            sh -c 'i=1; while [ "$i" -le 300 ]; do echo "dlv-live-tick-$i"; i=$((i+1)); sleep 0.2; done'

      - name: Run JavaScript unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:ui
        env:
          DLV_TEST_BASE_URL: http://127.0.0.1:18080
          DLV_LIVE_TEST_CONTAINER: docker-log-viewer-ci-smoke

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/docker-log-viewer.log
            ${{ runner.temp }}/docker-log-viewer-agent.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up test processes
        if: always()
        shell: bash
        run: |
          docker rm --force docker-log-viewer-ci-smoke 2>/dev/null || true
          if [[ -n "${DLV_AGENT_PID:-}" ]]; then
            kill "$DLV_AGENT_PID" 2>/dev/null || true
          fi
          if [[ -n "${DLV_SERVER_PID:-}" ]]; then
            kill "$DLV_SERVER_PID" 2>/dev/null || true
          fi

  release:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - secrets
      - go
      - ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "expected a semantic version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi

      - name: Create GitHub release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--verify-tag --generate-notes --fail-on-no-commits)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_args[@]}"
